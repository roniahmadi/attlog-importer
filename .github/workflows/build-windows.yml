name: build-windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Fyne memakai cgo, jadi butuh compiler C (MinGW-w64) dari MSYS2
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: Tambahkan MinGW ke PATH
        shell: pwsh
        run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build attlog-importer.exe
        shell: pwsh
        env:
          CGO_ENABLED: "1"
          CC: gcc
        run: go build -trimpath -ldflags "-H=windowsgui -s -w" -o attlog-importer.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: attlog-importer-windows
          path: attlog-importer.exe
          if-no-files-found: error

      - name: Buat GitHub Release (hanya untuk tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: attlog-importer.exe
